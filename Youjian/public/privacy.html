<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#F7F3EA" />
    <title>友间 · 隐私说明</title>
    <link rel="stylesheet" href="./legal.css" />
  </head>
  <body>
    <main>
      <a href="./">← 返回友间</a>
      <h1>隐私说明</h1>
      <p>友间仅向同一友间的活动成员展示完成核心功能所需的信息。</p>
      <section>
        <h2>友间成员可见</h2>
        <p>
          昵称、当前专注任务和分类、专注时长、共同目标及友间聚合统计。任务名称不会向友间外公开。
        </p>
      </section>
      <section>
        <h2>不会进入客户端日志</h2>
        <p>
          任务名称、昵称、邀请链接、邀请令牌和身份令牌不会写入前端诊断日志。邀请预览和业务数据不会由
          Service Worker 缓存。
        </p>
      </section>
      <section>
        <h2>历史记录</h2>
        <p>
          专注记录由服务端结算后不可修改。成员停用后，其历史记录仍会保留在历史周期统计中。
        </p>
      </section>
    </main>
  </body>
</html>
