<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#F7F3EA" />
    <title>友间 · 身份与数据说明</title>
    <link rel="stylesheet" href="/legal.css" />
  </head>
  <body>
    <main>
      <a href="/">← 返回友间</a>
      <h1>身份与数据说明</h1>
      <section>
        <h2>匿名身份</h2>
        <p>
          友间使用保存在当前浏览器或 PWA
          内的匿名身份，不要求邮箱、手机号或密码。
        </p>
      </section>
      <section>
        <h2>无法跨设备恢复</h2>
        <p>
          清除浏览器数据、更换设备或删除 PWA
          数据后，匿名身份无法恢复，历史记录也不能转移到新的身份。
        </p>
      </section>
      <section>
        <h2>停用</h2>
        <p>
          房主可以停用非房主成员。停用会立即撤销友间访问权限；正在进行的专注由服务端按权威时间结算，既有历史记录仍会保留。
        </p>
      </section>
    </main>
  </body>
</html>
